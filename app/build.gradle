plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghora.zikrbar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghora.zikrbar'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '2.2'
    }

    // Fixed key so every new build installs as an update over the old one
    signingConfigs {
        zikr {
            storeFile file('zikrbar.keystore')
            storePassword 'zikrbar123'
            keyAlias 'zikrbar'
            keyPassword 'zikrbar123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zikr
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.zikr
        }
    }

    // Fails the build if any code needs a newer Android than minSdk (keeps Android 6 working)
    lint {
        checkOnly 'NewApi', 'InlinedApi'
        abortOnError true
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
