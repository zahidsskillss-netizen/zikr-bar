plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghora.zikrbar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghora.zikrbar'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // Fixed key so every new build installs as an update over the old one
    signingConfigs {
        zikr {
            storeFile file('zikrbar.keystore')
            storePassword 'zikrbar123'
            keyAlias 'zikrbar'
            keyPassword 'zikrbar123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zikr
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.zikr
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
