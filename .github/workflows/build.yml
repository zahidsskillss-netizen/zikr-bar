name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle lintDebug assembleDebug --no-daemon

      - name: Rename APK
        run: |
          ls app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ZikrYad.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk ZikrYad-32bit.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk ZikrYad-Universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZikrYad-apk
          path: |
            ZikrYad.apk
            ZikrYad-32bit.apk
            ZikrYad-Universal.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zikr Yad (build ${{ github.run_number }})
          files: |
            ZikrYad.apk
            ZikrYad-32bit.apk
            ZikrYad-Universal.apk
          make_latest: true
