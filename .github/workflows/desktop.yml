name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build single-file exe
        run: dotnet publish desktop/ZikrYad/ZikrYad.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out

      - name: Rename
        shell: pwsh
        run: Copy-Item out/ZikrYad.exe ZikrYad-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ZikrYad-Windows
          path: ZikrYad-Windows.exe

      - name: Publish to the Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Zikr Yad for Windows
          body: "ذکر یاد د وینډوز لپاره — ZikrYad-Windows.exe ښکته کړئ او پرانیزئ."
          files: ZikrYad-Windows.exe
          make_latest: false
